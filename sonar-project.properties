sonar.organization=hatohui
sonar.projectKey=hatohui_limsim

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/tests/**
sonar.exclusions=build/**,cmake-build-*/**

sonar.cfamily.compile-commands=build/linux-gcc-coverage/compile_commands.json
sonar.coverageReportPaths=build/coverage.xml
